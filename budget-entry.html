<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บันทึกรายการงบประมาณ</title><link rel="stylesheet" href="budget-entry.css?v=auth1"><link rel="stylesheet" href="budget-sidebar.css?v=20261014-brand2"><link rel="stylesheet" href="school-auth.css?v=auth1"><script src="school-auth.js?v=auth1"></script></head><body data-budget-page="projects"><main><a href="budget-projects.html" target="_top">← โครงการและกิจกรรม</a><header><h1 id="projectTitle">บันทึกรายการงบประมาณ</h1></header><p id="status" role="status">กำลังอ่านยอดปัจจุบัน…</p><label>ประเภทงบประมาณ<select id="register" disabled></select></label><section class="metrics" aria-live="polite"><article><small>งบประมาณที่ได้รับ</small><strong id="received">—</strong></article><article><small>ยอดปัจจุบัน</small><strong id="current">—</strong></article><article><small>คงเหลือหลังรายการนี้</small><strong id="remaining">—</strong></article><article><small>รายการนี้ใช้ไป</small><strong id="thisSpent">0.00 บาท</strong></article></section><form id="entryForm"><div class="form-grid"><label>ที่ / เลขเอกสาร<input id="number" required maxlength="80" placeholder="เช่น 1/69"></label><label>วันที่<input id="date" type="date" required></label><label class="wide">รายการ<input id="description" required maxlength="500" placeholder="รายละเอียดการใช้เงิน"></label><label>จำนวนเงินที่ใช้ (บาท)<input id="spent" type="number" min="0.01" step="0.01" required inputmode="decimal"></label><label>หมายเหตุ<input id="note" maxlength="500" placeholder="เช่น 1.6 หรือข้อความเพิ่มเติม"></label></div><div class="actions"><button id="save" type="submit" disabled>บันทึกลง Sheet สำเนา</button><button id="reload" type="button">โหลดข้อมูลล่าสุด</button></div></form><section class="history"><h2>รายการในชุดทะเบียนนี้</h2><div class="table-wrap"><table><thead><tr><th>ที่</th><th>วันที่</th><th>รายการ</th><th>จำนวนเงินที่ใช้</th><th>คงเหลือ</th><th>หมายเหตุ</th></tr></thead><tbody id="entries"></tbody></table></div></section></main><script src="budget-sidebar.js?v=auth1" defer></script><script src="budget-api.js?v=auth1" defer></script><script src="budget-entry.js?v=auth1" defer></script></body></html>
